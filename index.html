<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="Js/js.js" defer></script>
    <title>Movie Watchlist</title>
</head>
<body class="container">
    <head>
        <h1>Your Watchlist</h1>
    </head>

    <main>
        <h2>Add a Movie</h2>
        <form id="movie-form">
            <label for="titleInput" id="titleLabel">Movie Title: </label>
            <input type="text" name="titleInput" id="movie-title">

            <label for="genreSelect" id="genreLabel">Genre: </label>
            <select name="genreSelect" id="movie-genre">
                <option value="">Choose a genre</option>
            </select>

            <button type="submit" id="submit">Add Movie</button>
        </form>
        <p id="form-message"></p>

        <h2>Your List</h2>
        <ul id="movie-list">

        </ul>
        <p id="empty-message"></p>
    </main>
</body>
</html>
